name: Release-plz Release

on:
    push:
        branches:
            - master

# Prevent concurrent runs from creating duplicate or conflicting PRs.
concurrency:
    group: release-plz-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release-plz-release:
        name: Release-plz release
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: read
        steps:
            # Generating a GitHub token so that tags and releases created by
            # release-plz can trigger downstream workflows.
            - name: Generate GitHub token
              uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
              id: generate-token
              with:
                  app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
                  private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

            - name: Checkout repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  fetch-depth: 0
                  token: ${{ steps.generate-token.outputs.token }}

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

            - name: Run release-plz
              uses: release-plz/action@1528104d2ca23787631a1c1f022abb64b34c1e11 # v0.5
              with:
                  command: release
              env:
                  GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
